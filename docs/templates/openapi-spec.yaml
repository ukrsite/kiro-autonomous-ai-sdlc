# OpenAPI Specification Template
# AI workflows generate this for any service that exposes REST endpoints.
# Place the generated spec at: {service_path}/docs/openapi.yaml
#
# The finalize job commits this alongside the code changes.

openapi: "3.0.3"
info:
  title: "{SERVICE_NAME} API"
  version: "{VERSION}"
  description: |
    Auto-generated API specification for {SERVICE_NAME}.
    Generated by Kiro CI workflow {WORKFLOW_ID} for {JIRA_ISSUE_KEY}.
  contact:
    name: "Kiro CI"

servers:
  - url: "http://localhost:8000"
    description: "Local development"

paths:
  # AI workflow populates this section with discovered/added endpoints.

components:
  schemas: {}
    # AI workflow populates this with request/response models.
