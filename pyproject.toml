[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "autonomous-ai-sdlc"
version = "0.1.0"
description = "Autonomous AI-driven Software Development Lifecycle Prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.82",
    "ruff>=0.1",
    "mcp",
    "pytest-cov>=4.0",
]

[project.scripts]
kiro-sdlc = "cli.kiro_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
